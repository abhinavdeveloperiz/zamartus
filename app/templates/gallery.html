{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- HERO -->

<section class="relative h-[50vh] md:h-[60vh] flex items-center">

    <div class="absolute inset-0">
        <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644" class="w-full h-full object-cover">
    </div>

    <div class="absolute inset-0 bg-black/60"></div>

    <div class="relative max-w-7xl mx-auto px-6 text-white">

        <h1 class="text-4xl font-bold border-l-4 border-b-4 border-[#d97706] pl-4 pb-4 inline-block">
            News & Updates
        </h1>

        <p class="mt-6 text-gray-200 text-md max-w-xl">
            Stay informed with the latest announcements, student achievements,
            placement success stories
        </p>

    </div>

</section>



<!-- NEWS GRID -->

<section class="py-24 bg-white">

    <div class="max-w-7xl mx-auto px-6">

        <!-- HEADER -->

        <div class="text-center mb-16">

            <h2 class="text-4xl md:text-5xl font-bold text-[#7A0048]">
                Latest News
            </h2>

        </div>


        <!-- GRID -->

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

            {% for news in news %}

            <div class="bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-xl transition relative group">

                <!-- SHARE BUTTON -->

                <button onclick="shareNews(
                '{{ news.title|escapejs }}',
                '{{ request.scheme }}://{{ request.get_host }}'
                )"
                    class="absolute top-3 right-3 z-20 bg-white shadow-md rounded-full w-9 h-9 flex items-center justify-center hover:bg-[#7A0048] hover:text-white transition">

                    <i class="fas fa-share-alt text-sm"></i>

                </button>


                <!-- IMAGE -->

                <div class="overflow-hidden">

                    <img src="{{ news.image.url }}"
                        class="w-full h-[220px] object-cover transform transition duration-500 group-hover:scale-110">

                </div>


                <!-- CONTENT -->

                <div class="p-6">

                    <h3 class="text-lg font-semibold text-[#7A0048]">
                        {{ news.heading }}
                    </h3>

                    <p class="text-gray-600 text-sm mt-3 leading-relaxed">
                        {{ news.description }}
                    </p>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</section>



<!-- SHARE SCRIPT -->

<script>

    function shareNews(title, url) {

        if (navigator.share) {

            navigator.share({
                title: title,
                text: title,
                url: url
            });

        } else {

            const shareText = title + " " + url;

            navigator.clipboard.writeText(shareText);

            alert("News link copied. You can now share it.");

        }

    }

</script>


{% endblock %}
