{% extends "base.html" %}

{% block head %}

<meta property="og:title" content="{{ news.heading }}">
<meta property="og:description" content="{{ news.description }}">
<meta property="og:image" content="{{ news.image.url }}">
<meta property="og:url" content="{{ request.build_absolute_uri }}">
<meta property="og:type" content="article">

<meta name="twitter:card" content="summary_large_image">

{% endblock %}

{% block content %}

<div class="relative bg-gray-50 py-16 mt-20">
    <div class="max-w-6xl mx-auto px-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10 items-start">
            <div class="lg:col-span-2 space-y-6">
                <div class="overflow-hidden rounded-3xl shadow-xl">
                    <img src="{{ news.image.url }}" alt="{{ news.heading }}" class="w-full h-auto object-cover">
                </div>

                <div class="space-y-4">
                    <h1 class="text-4xl md:text-5xl font-bold text-[#7A0048]">{{ news.heading }}</h1>
                    <p class="text-gray-600 text-lg leading-relaxed">{{ news.description }}</p>
                </div>
            </div>

            <aside class="space-y-6 bg-white p-6 rounded-3xl shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-semibold text-gray-900">Share this news</h2>
                        <p class="text-sm text-gray-500">Select a service or copy the link.</p>
                    </div>
                    <button id="shareToggleButton" type="button"
                        class="inline-flex items-center gap-2 rounded-full border border-[#7A0048] bg-[#7A0048] px-4 py-2 text-white hover:bg-[#5f003d] transition">
                        <i class="fas fa-share-alt"></i>
                        Share
                    </button>
                </div>

                <div id="shareOptions" class="hidden space-y-4">
                    <a href="https://www.facebook.com/sharer/sharer.php?u={{ request.build_absolute_uri }}"
                        target="_blank" rel="noreferrer"
                        class="flex items-center gap-3 rounded-2xl border border-gray-200 bg-blue-600 px-4 py-3 text-white hover:bg-blue-700 transition">
                        <i class="fab fa-facebook-f"></i>
                        Share on Facebook
                    </a>

                    <a href="https://twitter.com/intent/tweet?text={{ news.heading|urlencode }}&url={{ request.build_absolute_uri|urlencode }}"
                        target="_blank" rel="noreferrer"
                        class="flex items-center gap-3 rounded-2xl border border-gray-200 bg-sky-500 px-4 py-3 text-white hover:bg-sky-600 transition">
                        <i class="fab fa-twitter"></i>
                        Share on Twitter
                    </a>

                    <a href="https://wa.me/?text={{ news.heading|urlencode }}%20{{ request.build_absolute_uri|urlencode }}"
                        target="_blank" rel="noreferrer"
                        class="flex items-center gap-3 rounded-2xl border border-gray-200 bg-emerald-600 px-4 py-3 text-white hover:bg-emerald-700 transition">
                        <i class="fab fa-whatsapp"></i>
                        Share on WhatsApp
                    </a>

                    <button id="copyLinkButton" type="button"
                        class="w-full rounded-2xl border border-gray-200 bg-gray-100 px-4 py-3 text-left text-gray-800 hover:bg-gray-200 transition">
                        <span class="flex items-center justify-between">
                            <span><i class="fas fa-link mr-2"></i>Copy link</span>
                            <span id="copyStatus" class="text-sm text-[#7A0048]"></span>
                        </span>
                    </button>
                </div>
            </aside>
        </div>
    </div>
</div>

<script>
    const shareToggleButton = document.getElementById('shareToggleButton');
    const shareOptions = document.getElementById('shareOptions');
    const copyLinkButton = document.getElementById('copyLinkButton');
    const copyStatus = document.getElementById('copyStatus');
    const shareUrl = '{{ request.build_absolute_uri }}';
    const shareText = '{{ news.heading|escapejs }}';

    shareToggleButton.addEventListener('click', () => {
        shareOptions.classList.toggle('hidden');
        if (!shareOptions.classList.contains('hidden')) {
            shareToggleButton.innerHTML = '<i class="fas fa-share-alt"></i> Close';
        } else {
            shareToggleButton.innerHTML = '<i class="fas fa-share-alt"></i> Share';
        }
    });

    copyLinkButton.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(shareUrl);
            copyStatus.textContent = 'Copied!';
            setTimeout(() => { copyStatus.textContent = ''; }, 2000);
        } catch (err) {
            copyStatus.textContent = 'Failed';
        }
    });

    if (navigator.share) {
        const webShareButton = document.createElement('button');
        webShareButton.type = 'button';
        webShareButton.className = 'w-full rounded-2xl border border-gray-200 bg-gray-100 px-4 py-3 text-left text-gray-800 hover:bg-gray-200 transition';
        webShareButton.innerHTML = '<span class="flex items-center justify-between"><span><i class="fas fa-mobile-alt mr-2"></i>Share via device</span></span>';
        webShareButton.addEventListener('click', async () => {
            try {
                await navigator.share({
                    title: shareText,
                    text: shareText,
                    url: shareUrl
                });
            } catch (error) {
                console.warn('Share cancelled or failed', error);
            }
        });
        shareOptions.insertBefore(webShareButton, copyLinkButton);
    }
</script>

{% endblock %}
